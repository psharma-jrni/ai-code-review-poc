name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get diff
        id: diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD 2>/dev/null | head -c 30000 > /tmp/pr-diff.txt
          FILE_COUNT=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Build review prompt
        run: |
          cat > /tmp/review-prompt.txt << 'PROMPT'
          Use the code-review skill (.claude/skills/code-review/SKILL.md) to review this pull request. Follow the orchestrator instructions exactly: spawn the specialist sub-agents in parallel, then the aggregator, and output the aggregator's markdown verbatim as your final response. Do not add a preamble or postamble.

          Here is the PR diff:
          PROMPT

          echo "" >> /tmp/review-prompt.txt
          cat /tmp/pr-diff.txt >> /tmp/review-prompt.txt

      - name: Run AI review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat /tmp/review-prompt.txt)" \
            --allowedTools Read,Grep,Glob,Agent \
            --dangerously-skip-permissions \
            --output-format text > /tmp/review-output.txt 2>&1 || true
          echo "review_done=true" >> $GITHUB_OUTPUT

      - name: Post review comment
        if: steps.review.outputs.review_done == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review = '';
            try {
              review = fs.readFileSync('/tmp/review-output.txt', 'utf8');
            } catch (e) {
              review = 'Review failed to generate. Check Actions logs.';
            }

            if (review.length > 60000) {
              review = review.substring(0, 60000) + '\n\n... (truncated)';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*Powered by Claude Code + .claude/skills/code-review*`
            });
